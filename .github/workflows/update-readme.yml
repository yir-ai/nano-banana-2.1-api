name: Update prices
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save @yir-ai/sdk
      - run: |
          if [ -z "$YIR_API_KEY" ]; then echo "YIR_CATALOG_KEY not set"; exit 0; fi
          node scripts/update-readme.mjs
        env:
          # Key of a dedicated catalog account with no top-ups and the lowest monthly limit; it only reads models.
          YIR_API_KEY: ${{ secrets.YIR_CATALOG_KEY }}
      - name: Commit if prices changed
        run: |
          # Only the date in the footnote changed: skip the commit.
          if git diff --quiet -I 'as published by Yir on' README.md; then exit 0; fi
          git config user.name "yir-bot"
          git config user.email "bot@yir.ai"
          git commit -am "chore: refresh prices from Yir"
          git push
